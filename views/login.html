<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
<form id="login-form" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 w-full max-w-sm space-y-4" autocomplete="on">
<h1 class="text-xl font-bold text-slate-900">Illinois Medical Lien Calculator</h1><p class="text-xs font-bold text-red-600">TEST ENVIRONMENT - use fake data only</p>
<label class="block text-sm font-medium text-slate-700">Username
<input id="username" name="username" type="text" autocomplete="username" autofocus required class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></label>
<label class="block text-sm font-medium text-slate-700">Password
<span class="mt-1 flex gap-2"><input id="password" name="password" type="password" autocomplete="current-password" required class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
<button type="button" id="toggle" class="px-3 text-xs text-slate-600 border border-slate-300 rounded-lg">Show</button></span></label>
<p id="login-error" role="alert" class="text-xs text-red-600 min-h-[1rem]"></p>
<button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg">Sign in</button>
</form>
<script>
const form=document.getElementById('login-form'),pw=document.getElementById('password'),err=document.getElementById('login-error');
document.getElementById('toggle').addEventListener('click',e=>{const show=pw.type==='password';pw.type=show?'text':'password';e.target.textContent=show?'Hide':'Show'});
form.addEventListener('submit',async ev=>{ev.preventDefault();err.textContent='';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:pw.value})});
  const d=await r.json().catch(()=>({}));if(r.ok)location='/';else err.textContent=d.error||'Sign-in failed ('+r.status+')'}
 catch(e){err.textContent='Cannot reach the server. Check that it is running and the address is correct.'}});
</script></body></html>
